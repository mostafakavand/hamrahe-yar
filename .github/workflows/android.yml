
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Prepare web files and sync
        run: npm run build:android

      - name: Set Android app version
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("app/build.gradle")
          content = gradle_file.read_text()

          content, code_count = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+\s*$',
              r'\g<1>2',
              content,
              count=1
          )

          content, name_count = re.subn(
              r'''(?m)^(\s*versionName\s+)[\'"][^\'"]+[\'"]\s*$''',
              r'\g<1>"2.0.0"',
              content,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update Android version settings.")

          gradle_file.write_text(content)
          print("Android version set to 2.0.0 (versionCode 2)")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-yar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
