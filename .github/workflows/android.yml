
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Install image processing tool
        run: npm install --no-save --package-lock=false sharp

      - name: Create Android project
        run: npx cap add android

      - name: Prepare web files and sync
        run: npm run build:android

      - name: Set Android app version
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("app/build.gradle")
          content = gradle_file.read_text()

          content, code_count = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+\s*$',
              r'\g<1>2',
              content,
              count=1
          )

          content, name_count = re.subn(
              r'''(?m)^(\s*versionName\s+)[\'"][^\'"]+[\'"]\s*$''',
              r'\g<1>"2.0.0"',
              content,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update Android version settings.")

          gradle_file.write_text(content)
          print("Android version set to 2.0.0 (versionCode 2)")
          PY

      - name: Restore encrypted release keystore
        env:
          KEY_BACKUP_PASSWORD: ${{ secrets.KEY_BACKUP_PASSWORD }}
          ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTED_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEY_BACKUP_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" ]; then
            echo "Required signing secrets are missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" | base64 --decode > android/release-key.enc

          openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -in android/release-key.enc \
            -out android/app/hamrahe-yar-release.jks \
            -pass env:KEY_BACKUP_PASSWORD

          rm android/release-key.enc

          echo "Release keystore restored."

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          KEY_BACKUP_PASSWORD: ${{ secrets.KEY_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="android/app/build/outputs/apk/release/hamrah-yar-v2.0.0.apk"

          if [ ! -f "$APK_UNSIGNED" ]; then
            echo "Unsigned release APK was not found."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks android/app/hamrahe-yar-release.jks \
            --ks-key-alias hamrahe-yar \
            --ks-pass env:KEY_BACKUP_PASSWORD \
            --key-pass env:KEY_BACKUP_PASSWORD \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$APK_SIGNED"

          rm android/app/hamrahe-yar-release.jks

          echo "Signed release APK created successfully."

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-yar-release-v2.0.0
          path: android/app/build/outputs/apk/release/hamrah-yar-v2.0.0.apk
          if-no-files-found: error
          retention-days: 14
